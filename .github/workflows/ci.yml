name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install
      - run: make lint
      - run: make test
      - name: Eval gate (replays the recorded runs, no API key)
        run: python -m evals.runner replay --min-decision-accuracy 0.95
      - name: Eval gate on the multi-agent recordings
        run: python -m evals.runner replay --pipeline multi_agent --trials 1 --min-decision-accuracy 0.95
      - name: Documentation agent gate (every gap gets a request)
        run: python -m evals.gaps replay
      - name: LLM judge calibration (informs a review, never blocks a merge)
        continue-on-error: true
        run: python -m evals.calibration

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t priorauth-ai .
      - name: The image has no model SDK, and the app's imports and prompt load
        run: |
          docker run --rm priorauth-ai python -c "import importlib.util as u; assert u.find_spec('anthropic') is None"
          docker run --rm priorauth-ai python -c "import ui.data, evals.runner; from priorauth.matcher import load_prompt; load_prompt()"
      - name: The demo starts and answers
        run: |
          docker run -d -p 8080:8080 --name demo priorauth-ai
          for i in $(seq 1 30); do curl -sf localhost:8080/_stcore/health && exit 0; sleep 2; done
          docker logs demo
          exit 1
      - run: docker build -f Dockerfile.api -t priorauth-api .
      - name: The API starts without a key and serves its policies
        run: |
          docker run -d -p 8081:8080 --name api priorauth-api
          for i in $(seq 1 30); do curl -sf localhost:8081/health && break; sleep 2; done
          curl -sf localhost:8081/policies | grep -q l38773_first_mbb || { docker logs api; exit 1; }
