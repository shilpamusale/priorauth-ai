# Needs documentation: the patient has had back pain "for a while" and the chart never pins down when it
# began. The earliest note is about 8 weeks old, so 3 months cannot be confirmed.
policy_id: l38773_first_mbb
tags: [needs-documentation, gap-onset]
request:
  case_id: heldout_004
  payer: Medicare
  request_date: 2026-10-05
  service_code: "64493"
  icd10_codes: [M47.816]
  notes:
    - note_id: n1
      date: 2026-08-11
      note_type: primary care visit
      text: >-
        Low back pain "for a while"; the patient cannot say when it started. Axial, no radiation. Started
        ibuprofen 600 mg three times daily and referred to physical therapy.
    - note_id: n2
      date: 2026-09-08
      note_type: lumbar X-ray report
      text: >-
        Three views of the lumbar spine. Facet joint sclerosis and hypertrophy at L4-L5 and L5-S1. Vertebral
        heights and alignment preserved. No lytic or blastic lesion.
    - note_id: n3
      date: 2026-09-22
      note_type: physical therapy progress note
      text: >-
        6 weeks of physical therapy (12 visits). Oswestry Disability Index 38% at intake and 37% today. No
        improvement.
    - note_id: n4
      date: 2026-09-29
      note_type: pain management consult
      text: >-
        Axial low back pain of uncertain duration over the lower lumbar facets, no radiation. Pain NRS 6/10,
        ODI 37%; has cut back his work hours. Failed ibuprofen and 6 weeks of physical therapy. Neuro exam:
        strength, sensation and reflexes normal; straight-leg raise negative on both sides. No radicular
        symptoms or claudication. Red flags negative. Plan: L4-L5 and L5-S1 medial branch blocks.
