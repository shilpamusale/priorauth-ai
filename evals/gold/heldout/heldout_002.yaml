        Normal alignment.
    - note_id: n4
      date: 2026-09-30
      note_type: pain management consult
      text: >-
        Low back pain since February 2026, predominantly axial over the lower lumbar facets (about 75% of her
        pain), with intermittent aching into the left calf. Pain NRS 7/10, ODI 40%; cannot stand long enough
        to cook a meal. Failed meloxicam for 4 months and 8 weeks of physical therapy. Neuro exam: strength
        5/5, mildly reduced sensation over the top of the left foot, reflexes symmetric, straight-leg raise
        positive on the left at 60 degrees. Impression: left L5 radiculopathy caused by the L4-L5 facet
        synovial cyst, and axial facet-mediated pain. Plan: L4-L5 and L5-S1 medial branch blocks.
