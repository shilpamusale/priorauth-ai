      text: >-
        Low back pain since February 2026, mostly central, with occasional aching into the left calf. Started
        meloxicam 15 mg daily and referred to physical therapy.
    - note_id: n2
      date: 2026-06-12
      note_type: physical therapy discharge summary
      text: >-
        8 weeks of physical therapy completed. Back pain unchanged; the left calf aching comes and goes.
