# Ready to submit: a clean chart, each criterion documented once in plain language.
policy_id: l38773_first_mbb
tags: [ready, clean]
request:
  case_id: dev_001
  payer: Medicare
  request_date: 2026-09-15
  service_code: "64493"
  icd10_codes: [M47.816]
  notes:
    - note_id: n1
      date: 2026-03-10
      note_type: primary care visit
      text: >-
        58-year-old with low back pain that began in early February 2026 after yard work. The pain is
        across the lower back and worse with standing and twisting. No leg pain. Started naproxen 500 mg
        twice daily and referred to physical therapy.
    - note_id: n2
      date: 2026-06-05
      note_type: physical therapy discharge summary
      text: >-
        Completed 8 weeks of physical therapy (16 visits) for low back pain: core stabilization, extension
        exercises and a home exercise program. Patient attended every visit. Pain unchanged at discharge
        and no functional gains. Discharged for lack of progress.
    - note_id: n3
      date: 2026-07-28
      note_type: lumbar MRI report
      text: >-
        Facet arthropathy with hypertrophy at L4-L5 and L5-S1. Disc heights preserved. No fracture. No
        marrow signal abnormality to suggest tumor or infection. Normal alignment, no spondylolisthesis or
        scoliosis.
    - note_id: n4
      date: 2026-08-20
      note_type: pain management consult
      text: >-
        Chronic axial low back pain since February 2026, centered over the lower lumbar facets on both
        sides, without radiation into the legs. Pain NRS 7/10. Oswestry Disability Index 44%; unable to
        stand more than 15 minutes or sit through a workday. Failed naproxen for 3 months and 8 weeks of
        physical therapy. Neurological exam: strength 5/5 in both legs, sensation intact, reflexes 2+ and
        symmetric, straight-leg raise negative on both sides. No radicular symptoms or neurogenic
        claudication. Facet loading reproduces the pain. Plan: L4-L5 and L5-S1 medial branch blocks.
