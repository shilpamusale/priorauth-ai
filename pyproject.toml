[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "priorauth-ai"
version = "0.1.0"
description = "Agentic prior-authorization workflow with an evaluation harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "fpdf2>=2.7"]
ingest = ["pdfplumber>=0.11"]
agent = ["anthropic>=2.8"]
ui = ["streamlit>=1.40"]
track = ["mlflow-skinny>=3.18", "sqlalchemy>=2.0", "alembic>=1.13"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
retrieval = ["chromadb>=1.5"]
mcp = ["mcp>=2.3"]
# only to make short-lived Bedrock keys from AWS credentials; a Bedrock API key needs nothing extra
bedrock = ["aws-bedrock-token-generator>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
priorauth = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
